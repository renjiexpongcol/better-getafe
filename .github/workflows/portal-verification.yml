name: Portal verification

on:
  push:
    branches: [main, update-portal]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run check:runtime
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run test:production
      - run: npm run test:redis
      - run: npm run verify:deployment
      - run: npm run build:apps
      - run: npm run deploy:artifacts
      # Run last: replacing node_modules while tests/dev/builds run causes
      # transient ERR_MODULE_NOT_FOUND errors despite a correct lockfile.
      - run: npm ci --omit=dev
      - run: npm ls --omit=dev
      - run: npm run check:runtime
