events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream getafe_api { server api:8080; }
  upstream getafe_public { server public-web:80; }
  upstream getafe_resident { server resident-app:80; }
  upstream getafe_admin { server admin-portal:80; }

  server {
    listen 80 default_server;
    server_name _ public.getafe.local;

    location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }
    location /api/ { proxy_pass http://getafe_api; include /etc/nginx/proxy_params; }
    location / { proxy_pass http://getafe_public; include /etc/nginx/proxy_params; }
  }

  server {
    listen 80;
    server_name resident.getafe.local;

    location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }
    location /api/ { proxy_pass http://getafe_api; include /etc/nginx/proxy_params; }
    location / { proxy_pass http://getafe_resident; include /etc/nginx/proxy_params; }
  }

  server {
    listen 80;
    server_name admin.getafe.local;

    location = /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }
    location /api/ { proxy_pass http://getafe_api; include /etc/nginx/proxy_params; }
    location / { proxy_pass http://getafe_admin; include /etc/nginx/proxy_params; }
  }
}
