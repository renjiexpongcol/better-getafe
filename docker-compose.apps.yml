services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      REDIS_HOST: redis
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  public-web:
    build:
      context: .
      dockerfile: deploy/static-app/Dockerfile
      args:
        APP_SURFACE: public-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  resident-app:
    build:
      context: .
      dockerfile: deploy/static-app/Dockerfile
      args:
        APP_SURFACE: resident-app
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  admin-portal:
    build:
      context: .
      dockerfile: deploy/static-app/Dockerfile
      args:
        APP_SURFACE: admin-portal
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/reverse-proxy/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      api:
        condition: service_healthy
      public-web:
        condition: service_healthy
      resident-app:
        condition: service_healthy
      admin-portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
